services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://launchlab:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}@db:5432/launchlab
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: launchlab
      POSTGRES_USER: launchlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    volumes:
      - launchlab-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchlab -d launchlab"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
volumes:
  launchlab-db:
